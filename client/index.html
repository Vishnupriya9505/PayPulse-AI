<!DOCTYPE html>
<html lang="en">
<head>

  <title>PayPulse AI - Smart Financial Assistant</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">

<body>
  <div class="container">
    <h1>PayPulse AI 💡</h1>

    <div id="gridContainer" class="ag-theme-alpine"></div>

    <div class="card" id="aiOutput" style="display:none; margin-top: 20px;">

      <div id="aiInsights">Analyzing...</div>
    </div>

    <div style="margin-top: 30px;">
      <h3>Upgrade / Consolidate with PayPal</h3>
      <div id="paypal-button-container"></div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>

</body>
</html>
